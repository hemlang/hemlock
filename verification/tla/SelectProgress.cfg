\* Two selectors consume one item from each channel; every thread must finish (no lost wakeup, no lock-order deadlock).
SPECIFICATION Spec
CONSTANTS
  Caps <- Caps_Pair
  SendTo <- SendTo_Each
  RecvOn <- RecvOn_None
  NSelectors = 2
  CloseSet = {}
  Timeouts = FALSE
  Spurious = FALSE
  defaultInitValue = defaultInitValue
INVARIANTS TypeOK NoDuplicateDelivery DeliveredXorReleased RightChannel FIFO SendContract SelectContract SelectorsTakeDistinct WaiterLifetime Conservation RecvClosedOnlyWhenDrained
CHECK_DEADLOCK TRUE
