\* Three threads each hold a handle and join, detach or drop it, racing each
\* other and the worker. (Both backends run the same join/detach/release code
\* shape; they differ only in the spawn paths, see TaskDetachFn* and TaskCreateFails*.)
SPECIFICATION Spec
CONSTANTS
  NHolders = 3
  Backend = "interp"
  SpawnDetached = FALSE
  CreateFails = FALSE
  defaultInitValue = defaultInitValue
INVARIANTS FreedAtMostOnce RefCountSane OneJoin JoinXorDetach ErrorsDocumented NoLeak
CHECK_DEADLOCK TRUE
