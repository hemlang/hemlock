<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>HemlockScript - WASM</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a2e;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #4ecca3;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #888;
            margin-bottom: 20px;
        }
        #output {
            background: #0f0f1a;
            border: 1px solid #333;
            padding: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
            min-height: 200px;
            max-height: 600px;
            overflow-y: auto;
            border-radius: 4px;
        }
        .error { color: #ff6b6b; }
        .info { color: #4ecca3; }
        #status {
            margin: 10px 0;
            padding: 8px 12px;
            border-radius: 4px;
            display: inline-block;
        }
        .loading { background: #2d2d44; color: #ffd93d; }
        .ready { background: #1a3a2a; color: #4ecca3; }
        .failed { background: #3a1a1a; color: #ff6b6b; }
    </style>
</head>
<body>
    <h1>HemlockScript</h1>
    <p class="subtitle">Hemlock running in WebAssembly</p>
    <div id="status" class="loading">Loading WASM module...</div>
    <h3>Output:</h3>
    <pre id="output"></pre>

    <script>
        var outputEl = document.getElementById('output');
        var statusEl = document.getElementById('status');
        var startTime = performance.now();

        var Module = {
            print: function(text) {
                outputEl.textContent += text + '\n';
                outputEl.scrollTop = outputEl.scrollHeight;
            },
            printErr: function(text) {
                var span = document.createElement('span');
                span.className = 'error';
                span.textContent = text + '\n';
                outputEl.appendChild(span);
                outputEl.scrollTop = outputEl.scrollHeight;
                console.error(text);
            },
            onRuntimeInitialized: function() {
                var elapsed = (performance.now() - startTime).toFixed(1);
                statusEl.className = 'ready';
                statusEl.textContent = 'WASM module loaded (' + elapsed + 'ms)';

                // List files in virtual filesystem (for debugging)
                try {
                    var tmpFiles = FS.readdir('/tmp');
                    if (tmpFiles.length > 2) { // . and ..
                        console.log('Virtual FS /tmp:', tmpFiles);
                    }
                } catch(e) {}
            },
            onAbort: function(what) {
                statusEl.className = 'failed';
                statusEl.textContent = 'WASM module aborted: ' + what;
            }
        };
    </script>
    <!-- Replace with the compiled program's JS loader -->
    <script src="program.js"></script>
</body>
</html>
