name: macOS Sanity Test

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
    branches: [ main, master ]

env:
  USEARCH_VERSION: "v2.24.0"

jobs:
  macos-arm:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install coreutils libffi openssl@3 libwebsockets cmake
        echo "$(brew --prefix coreutils)/libexec/gnubin" >> $GITHUB_PATH

    - name: Build and install USearch
      run: |
        git clone --depth 1 --branch ${{ env.USEARCH_VERSION }} --recurse-submodules --shallow-submodules https://github.com/unum-cloud/usearch.git /tmp/usearch
        cmake -B /tmp/usearch/build -S /tmp/usearch \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DUSEARCH_BUILD_LIB_C=ON \
          -DUSEARCH_BUILD_TEST_C=OFF \
          -DUSEARCH_BUILD_TEST_CPP=OFF \
          -DUSEARCH_BUILD_BENCH_CPP=OFF
        cmake --build /tmp/usearch/build --config Release
        sudo cmake --install /tmp/usearch/build

    - name: Disable macOS firewall
      run: |
        sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off
        sudo /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate

    - name: Build interpreter
      run: make clean && make

    - name: Build stdlib
      run: make stdlib

    - name: Run interpreter tests
      run: timeout 300 make test

    - name: Build compiler
      run: make compiler

    - name: Run parity tests
      run: timeout 300 make parity
