name: Tests

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
    branches: [ main, master ]

env:
  USEARCH_VERSION: "v2.24.0"

jobs:
  # Main test job - interpreter tests
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make libwebsockets-dev libffi-dev zlib1g-dev libssl-dev cmake

    - name: Build and install USearch
      run: |
        git clone --depth 1 --branch ${{ env.USEARCH_VERSION }} --recurse-submodules --shallow-submodules https://github.com/unum-cloud/usearch.git /tmp/usearch
        cmake -B /tmp/usearch/build -S /tmp/usearch \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DUSEARCH_BUILD_LIB_C=ON \
          -DUSEARCH_BUILD_TEST_C=OFF \
          -DUSEARCH_BUILD_TEST_CPP=OFF \
          -DUSEARCH_BUILD_BENCH_CPP=OFF
        cmake --build /tmp/usearch/build --config Release
        sudo cp $(find /tmp/usearch/build -name 'libusearch_c.so' | head -1) /usr/local/lib/
        sudo cp /tmp/usearch/c/usearch.h /usr/local/include/
        sudo ldconfig
        ls -la /usr/local/lib/libusearch*

    - name: Build
      run: make clean && make && make stdlib

    - name: Run tests
      run: make test

    - name: Run WASM persistent context tests
      run: make test-wasm-context

  # Compiler tests
  compiler:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make libwebsockets-dev libffi-dev zlib1g-dev libssl-dev cmake

    - name: Build and install USearch
      run: |
        git clone --depth 1 --branch ${{ env.USEARCH_VERSION }} --recurse-submodules --shallow-submodules https://github.com/unum-cloud/usearch.git /tmp/usearch
        cmake -B /tmp/usearch/build -S /tmp/usearch \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DUSEARCH_BUILD_LIB_C=ON \
          -DUSEARCH_BUILD_TEST_C=OFF \
          -DUSEARCH_BUILD_TEST_CPP=OFF \
          -DUSEARCH_BUILD_BENCH_CPP=OFF
        cmake --build /tmp/usearch/build --config Release
        sudo cp $(find /tmp/usearch/build -name 'libusearch_c.so' | head -1) /usr/local/lib/
        sudo cp /tmp/usearch/c/usearch.h /usr/local/include/
        sudo ldconfig
        ls -la /usr/local/lib/libusearch*

    - name: Build compiler
      run: make compiler

    - name: Run compiler tests
      run: make test-compiler

  # Compiler memory regression tests - detect leaks in compiled binaries
  memory:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make libwebsockets-dev libffi-dev zlib1g-dev libssl-dev cmake

    - name: Build and install USearch
      run: |
        git clone --depth 1 --branch ${{ env.USEARCH_VERSION }} --recurse-submodules --shallow-submodules https://github.com/unum-cloud/usearch.git /tmp/usearch
        cmake -B /tmp/usearch/build -S /tmp/usearch \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DUSEARCH_BUILD_LIB_C=ON \
          -DUSEARCH_BUILD_TEST_C=OFF \
          -DUSEARCH_BUILD_TEST_CPP=OFF \
          -DUSEARCH_BUILD_BENCH_CPP=OFF
        cmake --build /tmp/usearch/build --config Release
        sudo cp $(find /tmp/usearch/build -name 'libusearch_c.so' | head -1) /usr/local/lib/
        sudo cp /tmp/usearch/c/usearch.h /usr/local/include/
        sudo ldconfig
        ls -la /usr/local/lib/libusearch*

    - name: Build compiler
      run: make compiler

    - name: Run memory regression tests
      run: make test-memory

  # Parity tests - verify compiled code matches interpreter
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make libwebsockets-dev libffi-dev zlib1g-dev libssl-dev cmake

    - name: Build and install USearch
      run: |
        git clone --depth 1 --branch ${{ env.USEARCH_VERSION }} --recurse-submodules --shallow-submodules https://github.com/unum-cloud/usearch.git /tmp/usearch
        cmake -B /tmp/usearch/build -S /tmp/usearch \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DUSEARCH_BUILD_LIB_C=ON \
          -DUSEARCH_BUILD_TEST_C=OFF \
          -DUSEARCH_BUILD_TEST_CPP=OFF \
          -DUSEARCH_BUILD_BENCH_CPP=OFF
        cmake --build /tmp/usearch/build --config Release
        sudo cp $(find /tmp/usearch/build -name 'libusearch_c.so' | head -1) /usr/local/lib/
        sudo cp /tmp/usearch/c/usearch.h /usr/local/include/
        sudo ldconfig
        ls -la /usr/local/lib/libusearch*

    - name: Build interpreter and compiler
      run: |
        make clean && make
        make compiler
        make stdlib

    - name: Run parity tests
      run: make parity

  # Compile check - verify interpreter tests compile with hemlockc
  compile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make libwebsockets-dev libffi-dev zlib1g-dev libssl-dev cmake

    - name: Build and install USearch
      run: |
        git clone --depth 1 --branch ${{ env.USEARCH_VERSION }} --recurse-submodules --shallow-submodules https://github.com/unum-cloud/usearch.git /tmp/usearch
        cmake -B /tmp/usearch/build -S /tmp/usearch \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DUSEARCH_BUILD_LIB_C=ON \
          -DUSEARCH_BUILD_TEST_C=OFF \
          -DUSEARCH_BUILD_TEST_CPP=OFF \
          -DUSEARCH_BUILD_BENCH_CPP=OFF
        cmake --build /tmp/usearch/build --config Release
        sudo cp $(find /tmp/usearch/build -name 'libusearch_c.so' | head -1) /usr/local/lib/
        sudo cp /tmp/usearch/c/usearch.h /usr/local/include/
        sudo ldconfig
        ls -la /usr/local/lib/libusearch*

    - name: Build compiler and runtime
      run: |
        make compiler
        make stdlib

    - name: Check interpreter tests compile
      run: make compile-check

  # Repo compile check - verify all .hml files compile with hemlockc
  repo-compile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make libwebsockets-dev libffi-dev zlib1g-dev libssl-dev cmake

    - name: Build and install USearch
      run: |
        git clone --depth 1 --branch ${{ env.USEARCH_VERSION }} --recurse-submodules --shallow-submodules https://github.com/unum-cloud/usearch.git /tmp/usearch
        cmake -B /tmp/usearch/build -S /tmp/usearch \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DUSEARCH_BUILD_LIB_C=ON \
          -DUSEARCH_BUILD_TEST_C=OFF \
          -DUSEARCH_BUILD_TEST_CPP=OFF \
          -DUSEARCH_BUILD_BENCH_CPP=OFF
        cmake --build /tmp/usearch/build --config Release
        sudo cp $(find /tmp/usearch/build -name 'libusearch_c.so' | head -1) /usr/local/lib/
        sudo cp /tmp/usearch/c/usearch.h /usr/local/include/
        sudo ldconfig
        ls -la /usr/local/lib/libusearch*

    - name: Build compiler
      run: make compiler

    - name: Check repo .hml files compile
      run: ./tests/run_repo_compile_check.sh

  # Bundler tests
  bundler:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make libwebsockets-dev libffi-dev zlib1g-dev libssl-dev cmake

    - name: Build and install USearch
      run: |
        git clone --depth 1 --branch ${{ env.USEARCH_VERSION }} --recurse-submodules --shallow-submodules https://github.com/unum-cloud/usearch.git /tmp/usearch
        cmake -B /tmp/usearch/build -S /tmp/usearch \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DUSEARCH_BUILD_LIB_C=ON \
          -DUSEARCH_BUILD_TEST_C=OFF \
          -DUSEARCH_BUILD_TEST_CPP=OFF \
          -DUSEARCH_BUILD_BENCH_CPP=OFF
        cmake --build /tmp/usearch/build --config Release
        sudo cp $(find /tmp/usearch/build -name 'libusearch_c.so' | head -1) /usr/local/lib/
        sudo cp /tmp/usearch/c/usearch.h /usr/local/include/
        sudo ldconfig
        ls -la /usr/local/lib/libusearch*

    - name: Build interpreter
      run: make clean && make && make stdlib

    - name: Run bundler tests
      run: make test-bundler

  # Formatter tests
  formatter:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make libffi-dev zlib1g-dev libssl-dev

    - name: Build interpreter
      run: make clean && make

    - name: Run formatter tests
      run: make test-formatter

  # Memory checks with AddressSanitizer
  asan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make libwebsockets-dev libffi-dev zlib1g-dev libssl-dev cmake

    - name: Build and install USearch
      run: |
        git clone --depth 1 --branch ${{ env.USEARCH_VERSION }} --recurse-submodules --shallow-submodules https://github.com/unum-cloud/usearch.git /tmp/usearch
        cmake -B /tmp/usearch/build -S /tmp/usearch \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DUSEARCH_BUILD_LIB_C=ON \
          -DUSEARCH_BUILD_TEST_C=OFF \
          -DUSEARCH_BUILD_TEST_CPP=OFF \
          -DUSEARCH_BUILD_BENCH_CPP=OFF
        cmake --build /tmp/usearch/build --config Release
        sudo cp $(find /tmp/usearch/build -name 'libusearch_c.so' | head -1) /usr/local/lib/
        sudo cp /tmp/usearch/c/usearch.h /usr/local/include/
        sudo ldconfig
        ls -la /usr/local/lib/libusearch*

    - name: Build with ASAN
      run: |
        make clean
        CFLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
        LDFLAGS="-fsanitize=address" \
        make

    - name: Build stdlib
      run: make stdlib

    - name: Run tests with ASAN
      run: make test
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=0

  # Valgrind memory check (optional, informational)
  valgrind:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make libwebsockets-dev libffi-dev zlib1g-dev libssl-dev valgrind cmake

    - name: Build and install USearch
      run: |
        git clone --depth 1 --branch ${{ env.USEARCH_VERSION }} --recurse-submodules --shallow-submodules https://github.com/unum-cloud/usearch.git /tmp/usearch
        cmake -B /tmp/usearch/build -S /tmp/usearch \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DUSEARCH_BUILD_LIB_C=ON \
          -DUSEARCH_BUILD_TEST_C=OFF \
          -DUSEARCH_BUILD_TEST_CPP=OFF \
          -DUSEARCH_BUILD_BENCH_CPP=OFF
        cmake --build /tmp/usearch/build --config Release
        sudo cp $(find /tmp/usearch/build -name 'libusearch_c.so' | head -1) /usr/local/lib/
        sudo cp /tmp/usearch/c/usearch.h /usr/local/include/
        sudo ldconfig
        ls -la /usr/local/lib/libusearch*

    - name: Build
      run: make clean && make && make stdlib

    - name: Run valgrind
      run: make valgrind
      continue-on-error: true

    - name: Upload valgrind logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: valgrind-logs
        path: valgrind-*.log
        if-no-files-found: ignore

  # WASM test validation (native) - verify WASM test files work with native compiler
  wasm-native:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make libwebsockets-dev libffi-dev zlib1g-dev libssl-dev

    - name: Build compiler
      run: make compiler

    - name: Run WASM tests via native compiler
      run: make wasm-test-native

  # Clang static analysis
  clang-analysis:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make libwebsockets-dev libffi-dev zlib1g-dev libssl-dev clang-tools clang-tidy

    - name: Run clang-tidy
      run: make clang-tidy

    - name: Run scan-build
      run: make scan-build
      continue-on-error: true  # Informational - don't fail CI

    - name: Upload scan-build reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: scan-build-reports
        path: scan-build-reports/
        if-no-files-found: ignore
